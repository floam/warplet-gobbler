name: Temporary Warplet bid audit

on:
  push:
    branches:
      - chatgpt-warplet-bid-audit-20260729

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Query Base and Superfluid balance ledger
        env:
          RPC_URL: https://base-mainnet.g.alchemy.com/v2/xn7PYKk2hrDMxsCtaYPcn
        run: node .github/scripts/warplet-bid-audit.cjs > warplet-bid-audit.json
      - name: Print compact audit summary
        run: |
          node - <<'NODE'
          const r = require('./warplet-bid-audit.json');
          console.log(JSON.stringify({
            generatedAt: r.generatedAt,
            latestBlock: r.chain.latestBlock,
            target: r.target,
            token: r.token,
            targetBidCount: r.targetBidCount,
            sequenceCount: r.sequenceCount,
            sequences: r.sequences.map(s => ({
              auctionName: s.auctionName,
              auctionAddress: s.auctionAddress,
              tokenId: s.tokenId,
              bidders: s.bidders,
              bids: s.bids.map(b => ({
                iso: b.block.iso,
                transactionHash: b.transactionHash,
                bidder: b.bidder,
                amountFormatted: b.amountFormatted,
                nativeValueEth: b.nativeValueEth,
                tokenTransfers: b.tokenTransfers,
              })),
              lifecycle: s.lifecycle,
            })),
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: warplet-bid-audit
          path: warplet-bid-audit.json
          if-no-files-found: error
          retention-days: 1
