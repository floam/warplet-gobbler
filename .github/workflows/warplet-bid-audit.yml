name: Temporary Warplet bid audit

on:
  push:
    branches:
      - chatgpt-warplet-bid-audit-20260729
  pull_request:
    branches:
      - main

concurrency:
  group: temporary-warplet-bid-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Trace auction tail
        run: node .github/scripts/warplet-duel-tail.mjs > warplet-bid-audit.json
      - name: Print tail
        run: cat warplet-bid-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: warplet-bid-audit
          path: warplet-bid-audit.json
          if-no-files-found: error
          retention-days: 1
