name: Temporary Warplet bid audit

on:
  push:
    branches:
      - chatgpt-warplet-bid-audit-20260729
  pull_request:
    branches:
      - main

concurrency:
  group: temporary-warplet-bid-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Discover exact bid sequence
        env:
          RPC_URL: https://rpc-endpoints.superfluid.dev/base-mainnet
        run: node .github/scripts/warplet-bid-discovery-rpc.mjs > warplet-bid-audit.json
      - name: Print bid sequence
        run: cat warplet-bid-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: warplet-bid-audit
          path: warplet-bid-audit.json
          if-no-files-found: error
          retention-days: 1
